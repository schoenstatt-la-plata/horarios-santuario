<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Santuario de Schoenstatt – Estado</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: #0e0e4a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
  .card { background: #fff; border-radius: 24px; width: 100%; max-width: 400px; overflow: hidden; box-shadow: 0 12px 50px rgba(0,0,0,0.5); }
  .header { background: #1a1a6e; padding: 36px 24px 30px; text-align: center; }
  .header img { width: 72px; height: 72px; margin: 0 auto 16px; display: block; }
  .header h1 { color: #f5c400; font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  .header p { color: rgba(245,196,0,0.6); font-size: 13px; font-style: italic; }
  .status-area { padding: 32px 28px 24px; text-align: center; }
  .estado-badge { display: inline-flex; align-items: center; gap: 10px; padding: 10px 22px; border-radius: 100px; font-size: 15px; font-weight: 600; font-family: Arial, sans-serif; letter-spacing: 0.5px; margin-bottom: 20px; }
  .estado-badge.abierto { background: #eaf7ed; color: #1a6e2e; border: 1.5px solid #a3d9af; }
  .estado-badge.cerrado { background: #f7eaea; color: #6e1a1a; border: 1.5px solid #d9a3a3; }
  .estado-badge.en-horario { background: #fff8e1; color: #7a5c00; border: 1.5px solid #f5c400; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dot.verde { background: #2ecc71; animation: pulse 2s ease-in-out infinite; }
  .dot.rojo { background: #c0392b; }
  .dot.amarillo { background: #f5c400; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.6;transform:scale(0.85);} }
  .hora-cierre { font-size: 52px; font-weight: 700; color: #1a1a6e; letter-spacing: -1px; margin-bottom: 6px; font-family: Arial, sans-serif; }
  .hora-label { font-size: 14px; color: #999; margin-bottom: 4px; font-style: italic; }
  .cerrado-msg { font-size: 15px; color: #888; line-height: 1.7; margin-bottom: 4px; }
  .divider { height: 1px; background: #f0f0f0; margin: 0 28px 20px; }

  /* HOY MISA */
  .misa-section { padding: 0 28px 20px; display: none; }
  .misa-section.visible { display: block; }
  .misa-titulo { font-size: 12px; font-weight: 700; color: #1a1a6e; font-family: Arial, sans-serif; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .misa-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .misa-pill {
    display: inline-flex; align-items: center; gap: 7px;
    background: #fff8e1; border: 1.5px solid #f5c400;
    border-radius: 100px; padding: 5px 14px;
    font-family: Arial, sans-serif; font-size: 13px;
    font-weight: 700; color: #7a5c00;
  }
  .misa-pill.en-curso {
    background: #fff3cd; border-color: #f5c400;
    color: #5a4000;
  }
  .misa-pill .misa-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #f5c400; flex-shrink: 0;
    animation: pulse 2s ease-in-out infinite;
  }

  .schedule-section { padding: 0 28px 24px; }
  .schedule-titulo { font-size: 12px; font-weight: 700; color: #1a1a6e; font-family: Arial, sans-serif; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 1px; }
  .dia-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .dia-row:last-child { margin-bottom: 0; }
  .dia-nombre { font-size: 12px; font-weight: 700; color: #1a1a6e; font-family: Arial, sans-serif; min-width: 34px; padding-top: 4px; }
  .dia-nombre.hoy { color: #f5c400; background: #1a1a6e; border-radius: 6px; padding: 2px 6px; font-size: 11px; margin-top: 2px; }
  .bloques { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; }
  .bloque-pill { background: #eaf7ed; color: #1a6e2e; border: 1px solid #a3d9af; border-radius: 100px; font-size: 11px; font-family: Arial, sans-serif; padding: 3px 9px; font-weight: 600; }
  .sin-turno { font-size: 12px; color: #ddd; font-family: Arial, sans-serif; font-style: italic; padding-top: 4px; }
  .footer-info { font-size: 12px; color: #aaa; text-align: center; line-height: 1.8; font-family: Arial, sans-serif; padding: 0 28px 4px; }
  .footer-info a { color: #f5c400; text-decoration: none; }
  .actualizado { font-size: 11px; color: #ccc; text-align: center; font-family: Arial, sans-serif; padding-bottom: 20px; margin-top: 4px; }
  .loading { font-size: 14px; color: #bbb; padding: 20px 0; font-style: italic; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <img src="logo.png" alt="Logo Schoenstatt" onerror="this.style.display='none'">
    <h1>Santuario de Schoenstatt</h1>
    <p>La Plata</p>
  </div>

  <div class="status-area" id="status-area">
    <p class="loading">Consultando estado...</p>
  </div>

  <!-- HOY MISA — aparece solo si hay misa hoy -->
  <div class="misa-section" id="misa-section">
    <div class="divider" style="margin: 0 0 16px;"></div>
    <p class="misa-titulo">✝ Hoy Misa</p>
    <div class="misa-pills" id="misa-pills"></div>
  </div>

  <div class="divider"></div>

  <div class="schedule-section" id="schedule-section" style="display:none">
    <p class="schedule-titulo">Horarios semanales</p>
    <div id="schedule-dias"></div>
  </div>

  <div class="divider" id="div2" style="display:none"></div>

  <div style="padding: 0 28px 4px;">
    <p class="footer-info">Movimiento Apostólico de Schoenstatt<br><a href="#">La Plata</a></p>
  </div>
  <p class="actualizado" id="actualizado"></p>
</div>

<script>
const API = 'https://santuario-api.vercel.app';
const DIAS_CORTO = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

let grillaCache = null;

function horaActual() {
  return new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
}

function getLunesDeHoy() {
  const hoy = new Date();
  const dia = hoy.getDay();
  const diff = dia === 0 ? -6 : 1 - dia;
  hoy.setDate(hoy.getDate() + diff);
  const y = hoy.getFullYear();
  const m = String(hoy.getMonth()+1).padStart(2,'0');
  const d = String(hoy.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+d;
}

function getMesHoy() {
  const hoy = new Date();
  return hoy.getFullYear() + '-' + String(hoy.getMonth()+1).padStart(2,'0');
}

function getDiaHoy() {
  return new Date().getDate(); // 1..31
}

// ── HOY MISA ──────────────────────────────────────────────
// Muestra misas del día desde 0:00 hasta 59 min después del inicio
function renderMisas(franjas) {
  const sec   = document.getElementById('misa-section');
  const pills = document.getElementById('misa-pills');

  if (!franjas || franjas.length === 0) {
    sec.classList.remove('visible');
    return;
  }

  const ahora   = new Date();
  const minNow  = ahora.getHours() * 60 + ahora.getMinutes();

  // Filtrar: desde 0:00 del día hasta 59 min después del inicio
  const visibles = franjas.filter(f => {
    const [h, m] = f.split(':').map(Number);
    const minMisa = h * 60 + m;
    return minNow <= minMisa + 59; // mostrar hasta 59 min después de comenzada
  });

  if (visibles.length === 0) {
    sec.classList.remove('visible');
    return;
  }

  pills.innerHTML = '';
  visibles.forEach(f => {
    const [h, m] = f.split(':').map(Number);
    const minMisa = h * 60 + m;
    const enCurso = minNow >= minMisa && minNow <= minMisa + 59;

    const pill = document.createElement('span');
    pill.className = 'misa-pill' + (enCurso ? ' en-curso' : '');
    pill.innerHTML = enCurso
      ? `<span class="misa-dot"></span>${f} hs.`
      : `${f} hs.`;
    pills.appendChild(pill);
  });

  sec.classList.add('visible');
}

// Obtiene misas del día: primero busca en mensual, fallback a semanal
async function cargarMisasHoy() {
  const mes    = getMesHoy();
  const diaNum = getDiaHoy();
  const diaSem = new Date().getDay();
  const lunes  = getLunesDeHoy();

  let franjas = [];

  try {
    // 1. Intentar misas mensuales para este día del mes
    const resMen = await fetch(API + '?action=getMisasMensual&mes=' + mes + '&t=' + Date.now());
    const dataMen = await resMen.json();
    if (dataMen.ok && dataMen.grilla && dataMen.grilla[diaNum]) {
      const f = Object.keys(dataMen.grilla[diaNum]).filter(k => dataMen.grilla[diaNum][k]);
      if (f.length > 0) { franjas = f; }
    }
  } catch {}

  if (franjas.length === 0) {
    try {
      // 2. Fallback: misas semanales para el día de la semana de hoy
      const resSem = await fetch(API + '?action=getMisasSemanal&semana=' + lunes + '&t=' + Date.now());
      const dataSem = await resSem.json();
      if (dataSem.ok && dataSem.grilla && dataSem.grilla[diaSem]) {
        franjas = Object.keys(dataSem.grilla[diaSem]).filter(k => dataSem.grilla[diaSem][k]);
      }
    } catch {}
  }

  // Ordenar cronológicamente
  franjas.sort((a, b) => {
    const [ah, am] = a.split(':').map(Number);
    const [bh, bm] = b.split(':').map(Number);
    return (ah * 60 + am) - (bh * 60 + bm);
  });

  renderMisas(franjas);
}

// ── Estado y schedule ──────────────────────────────────────
function estaEnHorarioHabitual(grilla) {
  if (!grilla) return false;
  const ahora = new Date();
  const diaHoy = ahora.getDay();
  const minutosAhora = ahora.getHours() * 60 + ahora.getMinutes();
  const franjas = Object.keys(grilla[diaHoy] || {}).filter(f => grilla[diaHoy][f]);
  if (franjas.length === 0) return false;
  return franjas.some(f => {
    const [h, m] = f.split(':').map(Number);
    const inicio = h * 60 + m;
    return minutosAhora >= inicio && minutosAhora < inicio + 15;
  });
}

function renderAbierto(horaCierre) {
  return `<div class="estado-badge abierto"><div class="dot verde"></div>Abierto ahora, la Mater te espera</div>
    <div class="hora-cierre">${horaCierre} hs.</div>
    <p class="hora-label">hora estimada de cierre</p>`;
}

function renderSinCustodioEnHorario() {
  return `<div class="estado-badge en-horario"><div class="dot amarillo"></div>Con custodio a confirmar</div>
    <p class="cerrado-msg">Este momento es un horario habitual en el que el Santuario se encuentra abierto.</p>`;
}

function renderCerrado() {
  return `<div class="estado-badge cerrado"><div class="dot rojo"></div>Cerrado</div>
    <p class="cerrado-msg">El Santuario no tiene<br>custodios presentes en este momento.</p>`;
}

function agruparBloques(franjas) {
  if (!franjas || franjas.length === 0) return [];
  const sorted = [...franjas].sort();
  const bloques = [];
  let inicio = sorted[0], anterior = sorted[0];
  for (let i = 1; i < sorted.length; i++) {
    const [hA, mA] = anterior.split(':').map(Number);
    const [hF, mF] = sorted[i].split(':').map(Number);
    if ((hF * 60 + mF) - (hA * 60 + mA) === 15) {
      anterior = sorted[i];
    } else {
      bloques.push(inicio + ' – ' + anterior);
      inicio = sorted[i]; anterior = sorted[i];
    }
  }
  bloques.push(inicio + ' – ' + anterior);
  return bloques;
}

function renderScheduleSemanal(grilla) {
  const sec = document.getElementById('schedule-section');
  const cont = document.getElementById('schedule-dias');
  const div2 = document.getElementById('div2');
  const diaHoy = new Date().getDay();

  if (!grilla) { sec.style.display = 'none'; div2.style.display = 'none'; return; }

  let hayAlgo = false;
  cont.innerHTML = '';

  for (let d = 0; d <= 6; d++) {
    const franjas = Object.keys(grilla[d] || {}).filter(f => grilla[d][f]);
    const bloques = agruparBloques(franjas);

    const row = document.createElement('div');
    row.className = 'dia-row';

    const nombre = document.createElement('div');
    nombre.className = 'dia-nombre' + (d === diaHoy ? ' hoy' : '');
    nombre.textContent = DIAS_CORTO[d];
    row.appendChild(nombre);

    const bloquesDiv = document.createElement('div');
    bloquesDiv.className = 'bloques';

    if (bloques.length > 0) {
      hayAlgo = true;
      bloques.forEach(b => {
        const pill = document.createElement('span');
        pill.className = 'bloque-pill';
        pill.textContent = b;
        bloquesDiv.appendChild(pill);
      });
    } else {
      const sin = document.createElement('span');
      sin.className = 'sin-turno';
      sin.textContent = 'sin turno';
      bloquesDiv.appendChild(sin);
    }

    row.appendChild(bloquesDiv);
    cont.appendChild(row);
  }

  sec.style.display = hayAlgo ? 'block' : 'none';
  div2.style.display = hayAlgo ? 'block' : 'none';
}

function renderEstado(data) {
  const area = document.getElementById('status-area');
  if (data.abierto && data.horaCierre) {
    area.innerHTML = renderAbierto(data.horaCierre);
  } else if (estaEnHorarioHabitual(grillaCache)) {
    area.innerHTML = renderSinCustodioEnHorario();
  } else {
    area.innerHTML = renderCerrado();
  }
  document.getElementById('actualizado').textContent = 'Actualizado a las ' + horaActual() + ' · Se actualiza cada 2 min';
}

function cargar() {
  const lunes = getLunesDeHoy();

  const promiseGrilla = fetch(API + '?action=getSchedule&semana=' + lunes + '&t=' + Date.now())
    .then(r => r.json())
    .then(data => {
      if (data.ok) {
        grillaCache = data.grilla;
        renderScheduleSemanal(data.grilla);
      }
    })
    .catch(() => {});

  const promiseEstado = fetch(API + '?action=estado&t=' + Date.now())
    .then(r => r.json())
    .catch(() => null);

  Promise.all([promiseGrilla, promiseEstado])
    .then(([, estadoData]) => {
      if (estadoData) {
        renderEstado(estadoData);
      } else {
        document.getElementById('status-area').innerHTML = '<p class="loading">No se pudo obtener el estado.</p>';
      }
    });

  cargarMisasHoy();
}

cargar();
setInterval(cargar, 120000);
</script>
</body>
</html>
