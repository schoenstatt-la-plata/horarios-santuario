<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin – Schedule Semanal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #0e0e4a; min-height: 100vh; padding: 1rem; }
  .top { background: #1a1a6e; border-radius: 16px; padding: 20px 20px 16px; text-align: center; margin-bottom: 16px; }
  .top h1 { color: #f5c400; font-size: 17px; margin-bottom: 4px; }
  .top p  { color: rgba(245,196,0,0.6); font-size: 12px; font-style: italic; }
  .semana-nav { display: flex; align-items: center; justify-content: center; gap: 12px; background: #fff; border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; }
  .semana-nav button { background: #1a1a6e; color: #f5c400; border: none; border-radius: 8px; width: 36px; height: 36px; font-size: 18px; cursor: pointer; }
  .semana-label { font-size: 14px; font-weight: 600; color: #1a1a6e; min-width: 180px; text-align: center; }
  .dias-tabs { display: flex; gap: 6px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 4px; }
  .dia-tab { flex-shrink: 0; background: rgba(255,255,255,0.15); color: #fff; border: none; border-radius: 10px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
  .dia-tab.activo { background: #f5c400; color: #1a1a6e; font-weight: 700; }
  .grilla-wrap { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 12px; max-height: 55vh; overflow-y: auto; }
  .grilla-titulo { font-size: 13px; color: #888; margin-bottom: 12px; font-style: italic; }
  .franjas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .franja { border: 1.5px solid #e0e0e0; border-radius: 8px; padding: 8px 4px; text-align: center; font-size: 13px; font-weight: 600; color: #aaa; cursor: pointer; transition: all 0.15s; user-select: none; }
  .franja.on { background: #eaf7ed; border-color: #a3d9af; color: #1a6e2e; }
  .acciones { display: flex; gap: 10px; }
  .btn-accion { flex: 1; padding: 15px 10px; border: none; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; text-align: center; line-height: 1.3; }
  .btn-accion.primario { background: #1a1a6e; color: #f5c400; }
  .btn-accion.secundario { background: #f5c400; color: #1a1a6e; }
  .btn-accion:disabled { opacity: 0.5; cursor: default; }
  .seleccionar-todo { display: flex; justify-content: flex-end; margin-bottom: 10px; gap: 8px; }
  .btn-sel { font-size: 12px; padding: 4px 10px; border: 1px solid #ddd; border-radius: 6px; background: #fff; color: #555; cursor: pointer; }
  .loading-msg { text-align: center; color: #aaa; font-size: 13px; padding: 20px 0; font-style: italic; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1a6e2e; color: #fff; padding: 12px 24px; border-radius: 100px; font-size: 14px; transition: transform 0.3s; pointer-events: none; white-space: nowrap; z-index: 999; }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="top">
  <h1>Panel de administración</h1>
  <p>Schedule semanal de custodios</p>
</div>

<div class="semana-nav">
  <button onclick="cambiarSemana(-1)">‹</button>
  <div class="semana-label" id="semana-label">Cargando...</div>
  <button onclick="cambiarSemana(1)">›</button>
</div>

<div class="dias-tabs" id="dias-tabs"></div>

<div class="grilla-wrap">
  <div class="seleccionar-todo">
    <button class="btn-sel" onclick="selTodo(true)">Todo el día ✓</button>
    <button class="btn-sel" onclick="selTodo(false)">Limpiar ✗</button>
  </div>
  <p class="grilla-titulo">Tocá cada franja para marcarla con custodio</p>
  <div class="franjas" id="franjas">
    <p class="loading-msg">Cargando schedule...</p>
  </div>
</div>

<div class="acciones">
  <button class="btn-accion secundario" id="btn-solo" onclick="guardar(false)">Modificar esta semana</button>
  <button class="btn-accion primario" id="btn-propagar" onclick="guardar(true)">Modificar esta semana y las 24 siguientes</button>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://santuario-api.vercel.app';
const DIAS_CORTO = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];

let semanaActual = getLunesDeHoy();
let diaSeleccionado = new Date().getDay();
let grilla = {};
for (let d = 0; d <= 6; d++) grilla[d] = {};

function getLunesDeHoy() {
  const hoy = new Date();
  const dia = hoy.getDay();
  const diff = dia === 0 ? -6 : 1 - dia;
  hoy.setDate(hoy.getDate() + diff);
  return formatFecha(hoy);
}

function formatFecha(d) {
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function parseFecha(s) {
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}

function labelSemana(lunes) {
  const d = parseFecha(lunes);
  const fin = new Date(d); fin.setDate(fin.getDate()+6);
  const opts = { day: 'numeric', month: 'short' };
  return d.toLocaleDateString('es-AR', opts) + ' – ' + fin.toLocaleDateString('es-AR', opts);
}

function cambiarSemana(dir) {
  const d = parseFecha(semanaActual);
  d.setDate(d.getDate() + dir * 7);
  semanaActual = formatFecha(d);
  cargarSchedule();
}

function renderTabs() {
  const cont = document.getElementById('dias-tabs');
  cont.innerHTML = '';
  DIAS_CORTO.forEach((nombre, i) => {
    const btn = document.createElement('button');
    btn.className = 'dia-tab' + (i === diaSeleccionado ? ' activo' : '');
    btn.textContent = nombre;
    btn.onclick = () => { diaSeleccionado = i; renderTabs(); renderFranjas(); };
    cont.appendChild(btn);
  });
}

function generarFranjas() {
  const f = [];
  for (let h = 0; h < 24; h++)
    for (let m = 0; m < 60; m += 15)
      f.push(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'));
  return f;
}

function renderFranjas() {
  const cont = document.getElementById('franjas');
  cont.innerHTML = '';
  generarFranjas().forEach(f => {
    const div = document.createElement('div');
    const on = grilla[diaSeleccionado] && grilla[diaSeleccionado][f];
    div.className = 'franja' + (on ? ' on' : '');
    div.textContent = f;
    div.onclick = () => {
      if (!grilla[diaSeleccionado]) grilla[diaSeleccionado] = {};
      grilla[diaSeleccionado][f] = !grilla[diaSeleccionado][f];
      div.classList.toggle('on', grilla[diaSeleccionado][f]);
    };
    cont.appendChild(div);
  });
}

function selTodo(val) {
  generarFranjas().forEach(f => {
    if (!grilla[diaSeleccionado]) grilla[diaSeleccionado] = {};
    grilla[diaSeleccionado][f] = val;
  });
  renderFranjas();
}

function cargarSchedule() {
  document.getElementById('semana-label').textContent = labelSemana(semanaActual);
  document.getElementById('franjas').innerHTML = '<p class="loading-msg">Cargando...</p>';

  fetch(API + '?action=getSchedule&semana=' + semanaActual + '&t=' + Date.now())
    .then(r => r.json())
    .then(data => {
      if (data.ok) {
        grilla = {};
        for (let d = 0; d <= 6; d++) grilla[d] = data.grilla[d] || {};
      }
      renderTabs();
      renderFranjas();
    })
    .catch(() => {
      document.getElementById('franjas').innerHTML = '<p class="loading-msg">Error al cargar.</p>';
    });
}

function soloActivas() {
  const activas = {};
  for (let d = 0; d <= 6; d++) {
    activas[d] = {};
    const dia = grilla[d] || {};
    for (const f in dia) { if (dia[f]) activas[d][f] = true; }
  }
  return activas;
}

async function guardar(propagar) {
  const btnSolo = document.getElementById('btn-solo');
  const btnProp = document.getElementById('btn-propagar');
  btnSolo.disabled = true;
  btnProp.disabled = true;
  btnSolo.textContent = propagar ? 'Modificar esta semana' : 'Guardando...';
  btnProp.textContent = propagar ? 'Guardando 25 semanas...' : 'Modificar esta semana y las 24 siguientes';

  const activas = soloActivas();
  const semanas = [semanaActual];

  if (propagar) {
    for (let i = 1; i <= 24; i++) {
      const d = parseFecha(semanaActual);
      d.setDate(d.getDate() + i * 7);
      semanas.push(formatFecha(d));
    }
  }

  let errores = 0;
  for (const sem of semanas) {
    try {
      const res = await fetch(API + '?action=saveSchedule&semana=' + sem +
        '&grilla=' + encodeURIComponent(JSON.stringify(activas)));
      const data = await res.json();
      if (!data.ok) errores++;
    } catch {
      errores++;
    }
  }

  btnSolo.disabled = false;
  btnProp.disabled = false;
  btnSolo.textContent = 'Modificar esta semana';
  btnProp.textContent = 'Modificar esta semana y las 24 siguientes';

  if (errores === 0) {
    mostrarToast(propagar ? '✓ 25 semanas guardadas' : '✓ Semana guardada');
  } else {
    mostrarToast('⚠ ' + errores + ' semana(s) con error');
  }
}

function mostrarToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

cargarSchedule();
</script>
</body>
</html>
